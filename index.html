<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>捷捷捷捷的个人网站</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            background: #f0f4ff;
        }

        .site-wrapper {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            background: linear-gradient(145deg, #e0f0ff 0%, #fce4ec 100%);
            background-blend-mode: overlay;
        }

        /* 开幕动画 */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 30% 40%, #fff9f9, #d4e8ff, #fce4ec);
            pointer-events: none;
            transition: opacity 0.7s ease;
        }

        .cube {
            width: 120px;
            height: 120px;
            background: #b8d0ff;
            box-shadow: 0 15px 40px rgba(90, 120, 200, 0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 300;
            color: #2b3a67;
            letter-spacing: 2px;
            transition: all 0.1s;
            animation: floatPulse 2.2s infinite alternate ease-in-out;
            will-change: transform, opacity;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes floatPulse {
            0% { transform: scale(1) translateY(0px); box-shadow: 0 10px 30px rgba(70, 100, 200, 0.2); }
            100% { transform: scale(1.03) translateY(-8px); box-shadow: 0 25px 50px rgba(70, 120, 220, 0.4); }
        }

        .cube-broken {
            animation: shatter 0.7s cubic-bezier(0.25, 0.1, 0.25, 1) forwards !important;
            pointer-events: none;
        }

        @keyframes shatter {
            0% { transform: scale(1) rotate(0deg); opacity: 1; border-radius: 12px; }
            20% { transform: scale(1.2) rotate(8deg); opacity: 0.9; }
            50% { transform: scale(0.4) rotate(-15deg) translateX(-30px) translateY(20px); opacity: 0.6; border-radius: 60% 20% 70% 10%; }
            80% { transform: scale(0.1) rotate(30deg) translateX(60px) translateY(-40px); opacity: 0.3; border-radius: 80% 10% 40% 60%; }
            100% { transform: scale(0) rotate(60deg) translateX(120px) translateY(60px); opacity: 0; border-radius: 100%; }
        }

        /* 主内容区域 — 使用flex列撑开 */
        .main-content {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px 40px;
            opacity: 0;
            transition: opacity 1.2s ease;
            width: 100%;
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
        }

        .main-content.active {
            opacity: 1;
        }

        /* ===== 顶部区域 ===== */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        /* 左侧个人简介卡片 */
        .profile-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(120, 140, 200, 0.12);
            width: 280px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .profile-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(120, 140, 200, 0.2);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #b8d0ff, #8aa8e0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(100, 140, 220, 0.3);
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e2b4a;
            margin-bottom: 4px;
        }

        .profile-card .subtitle {
            font-size: 0.85rem;
            color: #5a6f96;
            line-height: 1.6;
        }

        /* 右侧小方块区域 */
        .right-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            flex: 1;
        }

        /* 实时时间 */
        .time-box {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 10px 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(120, 140, 200, 0.1);
            font-size: 1.1rem;
            font-weight: 500;
            color: #1e2b4a;
            text-align: center;
            min-width: 140px;
        }

        .time-box .date-text {
            font-size: 0.7rem;
            font-weight: 300;
            opacity: 0.6;
            margin-top: 2px;
        }

        /* 小方块容器 - 横向排列 */
        .mini-blocks {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-top: 4px;
        }

        /* 小方块通用样式 */
        .mini-block {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px 22px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(120, 140, 200, 0.1);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e2b4a;
            min-width: 80px;
            text-align: center;
            position: relative;
        }

        .mini-block:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(120, 140, 200, 0.2);
            background: rgba(255, 255, 255, 0.8);
        }

        /* 中间空白区域 — 用flex撑起 */
        .middle-spacer {
            flex: 1 0 auto;
            min-height: 120px;
        }

        /* ===== 底部区域 — 固定在底部 ===== */
        .footer-section {
            margin-top: 40px;
            padding: 30px 30px 28px;
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            width: 100%;
        }

        .footer-section .footer-links {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .footer-section .footer-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.95rem;
            transition: 0.2s;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-section .footer-links a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 每个链接组（图标+文字+小字） */
        .footer-link-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .footer-link-group .link-main {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.95rem;
            transition: 0.2s;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .footer-link-group .link-main:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .footer-link-group .link-hint {
            font-size: 0.65rem;
            opacity: 0.5;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.3px;
            margin-top: -2px;
            transition: opacity 0.2s;
        }

        .footer-link-group:hover .link-hint {
            opacity: 0.85;
        }

        .footer-section .footer-copy {
            font-size: 0.8rem;
            opacity: 0.5;
            margin-top: 10px;
        }

        /* ===== 弹出面板 (公告板) ===== */
        .popup-panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            box-shadow: -10px 0 60px rgba(0, 0, 0, 0.15);
            z-index: 100;
            transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 30px 28px;
            overflow-y: auto;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }

        .popup-panel.open {
            right: 0;
        }

        .popup-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(150, 180, 255, 0.2);
        }

        .popup-panel .panel-header h3 {
            font-size: 1.3rem;
            color: #1e2b4a;
        }

        .popup-panel .panel-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .popup-panel .panel-close:hover {
            background: rgba(0,0,0,0.05);
            color: #333;
        }

        .popup-panel .panel-content {
            color: #2a3a5a;
            line-height: 1.8;
        }

        .popup-panel .panel-content ul {
            list-style: none;
            padding-left: 0;
        }

        .popup-panel .panel-content ul li {
            padding: 10px 14px;
            margin-bottom: 6px;
            background: rgba(200, 220, 255, 0.15);
            border-radius: 12px;
            border-left: 3px solid #7b95d0;
        }

        .popup-panel .panel-content ul li::before {
            content: "✦ ";
            color: #6a7fc0;
        }

        /* 遮罩 */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .popup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .top-section {
                flex-direction: column;
                align-items: stretch;
            }

            .profile-card {
                width: 100%;
            }

            .right-side {
                align-items: stretch;
            }

            .mini-blocks {
                justify-content: flex-start;
            }

            .popup-panel {
                width: 100%;
                right: -100%;
            }

            .footer-section .footer-links {
                gap: 24px;
            }
        }

        @media (max-width: 600px) {
            .main-content {
                padding: 16px;
            }

            .profile-card {
                padding: 18px 16px;
            }

            .mini-block {
                padding: 10px 16px;
                min-width: 60px;
                font-size: 0.8rem;
            }

            .time-box {
                font-size: 0.95rem;
                padding: 8px 16px;
                min-width: 100px;
            }

            .footer-section .footer-links {
                gap: 16px;
            }

            .footer-section .footer-links a {
                font-size: 0.85rem;
            }
        }

        /* 滚动条美化 */
        .popup-panel::-webkit-scrollbar {
            width: 4px;
        }
        .popup-panel::-webkit-scrollbar-thumb {
            background: #b0c4e0;
            border-radius: 20px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b0c4e0;
            border-radius: 20px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>

<div class="site-wrapper">
    <!-- 开幕层 -->
    <div id="introOverlay" class="intro-overlay">
        <div id="cube" class="cube">✦</div>
    </div>

    <!-- 遮罩 -->
    <div id="popupOverlay" class="popup-overlay"></div>

    <!-- 弹出面板 (公告板) -->
    <div id="popupPanel" class="popup-panel">
        <div class="panel-header">
            <h3><i class="fas fa-bullhorn"></i> 公告板</h3>
            <button class="panel-close" id="panelClose"><i class="fas fa-times"></i></button>
        </div>
        <div class="panel-content">
            <ul>
                <li>该网站暂时处于测试阶段</li>
                <li>欢迎提出宝贵建议</li>
                <li>更多内容正在准备中...</li>
                <li>预计正式上线时间：待定</li>
                <li>✨ 感谢你的访问</li>
            </ul>
            <p style="margin-top: 16px; font-size: 0.85rem; opacity: 0.6; text-align: center;">滚动可查看更多内容</p>
        </div>
    </div>

    <!-- 主内容 -->
    <div id="mainContent" class="main-content">
        <!-- 顶部区域 -->
        <div class="top-section">
            <!-- 左侧：个人简介卡片 -->
            <div class="profile-card">
                <div class="profile-avatar">
                    <img 
                        src="https://i.imgs.ovh/2026/08/27/39491e380b4a522006f840705c8117b3.jpg" 
                        alt="头像" 
                        id="avatarImg"
                        onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=jiejie';"
                        style="width:100%; height:100%; object-fit:cover;"
                    >
                </div>
                <h2>捷捷捷捷</h2>
                <p class="subtitle">欢迎你来到我的个人网站。<br>我是 <strong>捷捷捷捷</strong></p>
            </div>

            <!-- 右侧 -->
            <div class="right-side">
                <!-- 实时时间 -->
                <div class="time-box" id="timeBox">
                    <span id="timeDisplay">00:00:00</span>
                    <div class="date-text" id="dateDisplay">----年--月--日</div>
                </div>

                <!-- 小方块们 -->
                <div class="mini-blocks">
                    <div class="mini-block" id="announcementBtn">
                        <i class="fas fa-bullhorn"></i> 公告
                    </div>
                    <div class="mini-block" id="blankBtn1">
                        <i class="fas fa-ellipsis-h"></i> 空白
                    </div>
                    <div class="mini-block" id="blankBtn2">
                        <i class="fas fa-ellipsis-h"></i> 空白
                    </div>
                </div>
            </div>
        </div>

        <!-- 中间弹性空白区域，把底部推到底部 -->
        <div class="middle-spacer"></div>

        <!-- 底部区域 -->
        <div class="footer-section">
            <div class="footer-links">
                <!-- GitHub 链接（占位） -->
                <div class="footer-link-group">
                    <a href="#" class="link-main">
                        <i class="fab fa-github"></i> GitHub
                    </a>
                    <span class="link-hint">——</span>
                </div>

                <!-- Bilibili 链接：跳转到指定空间，带小字 -->
                <div class="footer-link-group">
                    <a href="https://space.bilibili.com/518073863?spm_id_from=333.1007.0.0" 
                       target="_blank" 
                       rel="noopener noreferrer" 
                       class="link-main">
                        <i class="fab fa-bilibili"></i> bilibili
                    </a>
                    <span class="link-hint">点我跳转</span>
                </div>
            </div>
            <div class="footer-copy">© 2026 — 捷捷捷捷 · 保留所有权利</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 1. 开幕动画 ----------
        const overlay = document.getElementById('introOverlay');
        const cube = document.getElementById('cube');
        const mainContent = document.getElementById('mainContent');

        function playGlassBreak() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 0.25;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const t = i / bufferSize;
                    const env = Math.exp(-t * 8) * (0.7 + 0.3 * Math.sin(t * 120));
                    const noise = (Math.random() * 2 - 1) * env;
                    const shatter = 0.3 * Math.sin(t * 700) * Math.exp(-t * 6);
                    data[i] = noise * 0.8 + shatter * 0.6;
                }
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1800;
                filter.Q.value = 1.2;
                const gain = audioCtx.createGain();
                gain.gain.value = 0.6;
                source.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                source.start();
                source.onended = () => {
                    audioCtx.close().catch(() => {});
                };
            } catch (e) {
                console.log('音频不可用');
            }
        }

        function startIntro() {
            cube.classList.add('cube-broken');
            playGlassBreak();
            setTimeout(() => {
                overlay.style.opacity = '0';
                mainContent.classList.add('active');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 800);
            }, 700);
        }

        window.addEventListener('load', startIntro);

        // ---------- 2. 实时时钟 ----------
        function updateClock() {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' +
                            String(now.getMinutes()).padStart(2, '0') + ':' +
                            String(now.getSeconds()).padStart(2, '0');
            const dateStr = now.getFullYear() + '年' +
                            String(now.getMonth() + 1).padStart(2, '0') + '月' +
                            String(now.getDate()).padStart(2, '0') + '日';
            document.getElementById('timeDisplay').textContent = timeStr;
            document.getElementById('dateDisplay').textContent = dateStr;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ---------- 3. 公告板弹出 ----------
        const panel = document.getElementById('popupPanel');
        const overlay2 = document.getElementById('popupOverlay');
        const announcementBtn = document.getElementById('announcementBtn');
        const panelClose = document.getElementById('panelClose');

        function openPanel() {
            panel.classList.add('open');
            overlay2.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closePanel() {
            panel.classList.remove('open');
            overlay2.classList.remove('show');
            document.body.style.overflow = '';
        }

        announcementBtn.addEventListener('click', openPanel);
        panelClose.addEventListener('click', closePanel);
        overlay2.addEventListener('click', closePanel);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePanel();
        });

        // ---------- 4. 空白方块占位点击提示 ----------
        document.getElementById('blankBtn1').addEventListener('click', function() {
            alert('📦 这个板块还在建设中，敬请期待！');
        });

        document.getElementById('blankBtn2').addEventListener('click', function() {
            alert('📦 这个板块还在建设中，敬请期待！');
        });

        // ---------- 5. 头像点击更换提示 ----------
        document.getElementById('avatarImg').addEventListener('click', function() {
            alert('🖼️ 点击上传头像功能\n(您可以直接替换 img 的 src 属性)');
        });

        console.log('✨ 捷捷捷捷的个人网站已启动');
    })();
</script>
</body>
</html>
